# ============================================================
# Dart API 代码生成工具 - 配置文件
# ============================================================
# 使用方式:
#   1. 将此文件放在项目根目录，命名为 dart_api_gen.yaml
#   2. 运行: dart run bin/dart_api_gen.dart
#   3. 也可以指定配置文件路径:
#      dart run bin/dart_api_gen.dart -c path/to/dart_api_gen.yaml
#   4. CLI 参数可覆盖配置文件中的值:
#      dart run bin/dart_api_gen.dart -o ./lib/generated
#   5. 配置了 environments 后，可用 --env 选择使用哪个环境的 URL:
#      dart run bin/dart_api_gen.dart --env production
# ============================================================

# ------------------------------------------------------------
# Swagger JSON 来源配置
# ------------------------------------------------------------
# 方式1: 远程 URL —— 从 HTTP 接口获取 Swagger JSON（推荐用于 CI/CD）
# 方式2: 本地文件 —— 读取本地 Swagger JSON 文件（推荐用于开发调试）
# 方式3: 多环境 URL —— 为 local/dev/testing/production 各配一个 URL，
#         运行时用 --env <name> 选择使用哪个环境（见下方 environments）
#
# 注意: url 和 file 只能二选一，不能同时配置
#
# 简写形式（直接写路径或URL，等价于下面的展开形式）:
#   source: "./swagger.json"
#   source: "http://127.0.0.1:2387/swagger/all/swagger.json"
source:
  # 远程 URL 地址
  # url: "http://127.0.0.1:2387/swagger/all/swagger.json"

  # 本地文件路径（相对于运行目录或绝对路径）
  file: './example/swagger.json'

  # 多环境 URL 配置（可选）
  # 键只能是 local / dev / testing / production，值为对应环境的 Swagger URL
  # 用法: dart run bin/dart_api_gen.dart --env dev
  # 未指定 --env 时，按 local → dev → testing → production 顺序取第一个已定义的环境
  # 优先级: --url/--file > --env > environments(固定顺序回退) > source.url/source.file
  # environments:
  #   local: "http://127.0.0.1:2387/swagger/all/swagger.json"
  #   dev: "http://dev.example.com/swagger.json"
  #   testing: "http://test.example.com/swagger.json"
  #   production: "https://api.example.com/swagger.json"

# ------------------------------------------------------------
# 输出配置
# ------------------------------------------------------------
# 生成的 Dart 代码文件的输出目录
# 路径相对于运行目录，也可以使用绝对路径
#
# 简写形式:
#   output: "./lib/api"
output:
  # 生成代码的输出目录
  dir: './lib/api'

# ------------------------------------------------------------
# 可选配置
# ------------------------------------------------------------
options:
  # 是否保存原始 Swagger JSON 到输出目录的 swagger/index.json
  # 方便排查生成问题，查看原始 API 定义
  # 默认值: true
  save_swagger_json: true

  # 是否生成 Controller 控制器文件
  # 设为 false 则不生成 controller 目录及相关文件
  # 默认值: true
  generate_controllers: true

  # 是否生成枚举类型文件
  # 设为 false 则不生成 enum 目录及相关文件
  # 默认值: true
  generate_enums: true

  # 是否生成 Types 类型模型文件
  # 设为 false 则不生成 types 目录及相关文件
  # 默认值: true
  generate_types: true

  # 是否生成 index.dart 导出文件
  # 包括 controller/index.dart、types/index.dart、enum/index.dart
  # 方便统一导入，避免手动维护导出列表
  # 默认值: true
  generate_index: true

  # 是否覆盖已存在的生成文件
  # true: 每次生成时先删除输出目录中已有的文件，再重新生成
  # false: 如果目标文件已存在则跳过，不覆盖（保留手动修改过的文件）
  # 默认值: true
  overwrite: true

  # 是否在生成完成后自动执行 build_runner 生成 .g.dart 文件
  # true: 生成完成后自动执行 dart run build_runner build --delete-conflicting-outputs
  # false: 仅生成代码，不自动执行 build_runner（需手动运行）
  # 默认值: true
  run_build_runner: true
